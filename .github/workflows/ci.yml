name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Проверка синтаксиса (PowerShell 5.1 и 7)
        shell: pwsh
        run: |
          $files = Get-ChildItem -Recurse -Include *.ps1
          $failed = 0
          foreach ($f in $files) {
            $tokens = $null; $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            foreach ($e in $errors) {
              Write-Host "::error file=$($f.FullName),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed++
            }
          }
          if ($failed -gt 0) { throw "Синтаксических ошибок: $failed" }
          Write-Host "Синтаксис в порядке: $($files.Count) файлов"

      - name: Установка PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber

      - name: Статический анализ
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $settings = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          $results = Invoke-ScriptAnalyzer -Path $PWD -Recurse -Settings $settings -Severity Error, Warning
          if ($results) {
            $results | Select-Object ScriptName, Line, RuleName, Message | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          }
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer: ошибок $($errors.Count)" }
          Write-Host "Предупреждений: $(@($results).Count), ошибок: 0"

      - name: Smoke-тесты (без рабочего стола)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "Smoke-тесты провалены" }

      - name: Сборка релизного архива
        shell: pwsh
        run: .\tools\build-package.ps1 -Output dist

      - name: Архив как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: DesktopGroups-package
          path: dist/*.zip
          if-no-files-found: error
