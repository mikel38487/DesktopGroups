name: CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  analyze-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # Кодировка и разбор под тем хостом, которым программа реально
      # запускается: Windows PowerShell 5.1.
      - name: Кодировка и разбор (PowerShell 5.1)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\check-encoding.ps1
          if ($LASTEXITCODE -ne 0) { throw "проверка кодировки/разбора провалена" }

      - name: Кодировка и разбор (PowerShell 7)
        shell: pwsh
        run: |
          .\tests\check-encoding.ps1
          if ($LASTEXITCODE -ne 0) { throw "проверка кодировки/разбора провалена" }

      - name: Установка PSScriptAnalyzer
        shell: pwsh
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -AllowClobber -RequiredVersion 1.25.0

      - name: Статический анализ
        shell: pwsh
        run: |
          Import-Module PSScriptAnalyzer
          $settings = Join-Path $PWD 'PSScriptAnalyzerSettings.psd1'
          $results = Invoke-ScriptAnalyzer -Path $PWD -Recurse -Settings $settings -Severity Error, Warning
          if ($results) {
            $results | Select-Object ScriptName, Line, RuleName, Message | Format-Table -AutoSize | Out-String -Width 200 | Write-Host
          }
          $errors = @($results | Where-Object Severity -eq 'Error')
          if ($errors.Count -gt 0) { throw "PSScriptAnalyzer: ошибок $($errors.Count)" }
          Write-Host "Предупреждений: $(@($results).Count), ошибок: 0"

      - name: Smoke-тесты (без рабочего стола)
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\smoke.ps1
          if ($LASTEXITCODE -ne 0) { throw "Smoke-тесты провалены" }

      - name: Фаззинг config.json
        shell: pwsh
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tests\fuzz-config.ps1
          if ($LASTEXITCODE -ne 0) { throw "Фаззинг провален" }

      - name: Сборка релизного архива
        shell: pwsh
        run: .\tools\build-package.ps1 -Output dist

      - name: Архив как артефакт
        uses: actions/upload-artifact@v7
        with:
          name: DesktopGroups-package
          path: dist/*.zip
          if-no-files-found: error
